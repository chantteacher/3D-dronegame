<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}*,*::before,*::after{box-sizing:border-box}</style>
<title>우리학교 드론 배송</title>
<!-- ▼ 교사 현황판 연결: 따옴표 안에 구글 Apps Script 웹 앱 주소(https://script.google.com/macros/s/…/exec)를 붙여넣으세요. 비워 두면 현황판 없이 동작해요. -->
<script>window.SHEET_URL = "";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Type: 둥글고 따뜻한 손맛 — 제목 Jua, 본문 Gowun Dodum, 좌표 숫자 IBM Plex Mono */
/* Layout: 학교 관제 콘솔 — 왼쪽 3D 학교 디오라마, 오른쪽 미션 카드. 폰에서는 위아래로 쌓임 */
:root{
  --bg:#E6EBEE; --panel:#F8FAFB; --soft:#EEF2F4; --ink:#13222C; --muted:#586873;
  --line:#C6D0D7; --accent:#E8590C; --accent-ink:#FFFFFF;
  --sky1:#CFE0EA; --sky2:#EEF2EC;
  --ok:#1C8A4C; --ok-bg:#E1F2E7; --bad:#B9322A; --bad-bg:#F8E3E1;
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E171E; --panel:#15212A; --soft:#111C24; --ink:#E4ECF0; --muted:#8C9EAA;
  --line:#2A3A46; --accent:#FF7A2E; --accent-ink:#1A0D04; --sky1:#1A2A36; --sky2:#24323A;
  --ok:#4BC67F; --ok-bg:#16301F; --bad:#F06B60; --bad-bg:#3A1D1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E171E; --panel:#15212A; --soft:#111C24; --ink:#E4ECF0; --muted:#8C9EAA;
  --line:#2A3A46; --accent:#FF7A2E; --accent-ink:#1A0D04; --sky1:#1A2A36; --sky2:#24323A;
  --ok:#4BC67F; --ok-bg:#16301F; --bad:#F06B60; --bad-bg:#3A1D1B; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 16px}
.brand{font-family:var(--f-display);font-size:24px;line-height:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted);display:grid;place-items:center;padding:0}
.dot.cur{border-color:var(--accent);color:var(--accent)}
.dot.done{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.dot.lock{opacity:.5;cursor:not-allowed;border-style:dashed;font-size:11px}
.dot.peek{background:var(--muted);border-color:var(--muted);color:var(--panel)}
.meta{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-size:20px;font-variant-numeric:tabular-nums}
#who{font-family:var(--f-body);color:var(--ink);font-weight:500}
.ghost{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;font-size:13px;font-family:var(--f-body)}
.ghost:hover{border-color:var(--ink)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
#resultBtn:not(:disabled){background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.track{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:0 16px 10px;padding:7px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13px;color:var(--muted)}
.track b{font-weight:400}
.track i{font-style:normal;font-family:var(--f-mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.track .warn i{color:var(--bad)}
.track .rec{margin-left:auto;color:var(--bad);font-size:12px}
.track .rec.done{color:var(--ok)}
.certwrap{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.certwrap>.cert{transform-origin:0 0}
.ghost[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,38vw,420px);gap:16px;padding:0 16px 16px}
.stage{position:relative;min-width:0;min-height:340px;background:linear-gradient(180deg,var(--sky1),var(--sky2));border:1px solid var(--line);border-radius:14px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.lbl.pt{font-family:var(--f-mono);font-size:12px;font-weight:600;color:#13222C;background:rgba(255,255,255,.88);border:1px solid rgba(19,34,44,.25);border-radius:6px;padding:0 6px;font-variant-numeric:tabular-nums}
.lbl.pt b{color:#C24A08}
.lbl.pt.ok{border-color:#1C8A4C;color:#14683A}
.lbl.pt.bad{border-color:#B9322A;color:#B9322A}
.lbl.drone{font-family:var(--f-mono);font-size:11px;color:#fff;background:#13222C;border-radius:5px;padding:0 5px;font-variant-numeric:tabular-nums}
.lbl.tick{font-family:var(--f-mono);font-size:11px;color:#2C3B45;text-shadow:0 0 3px #fff,0 0 3px #fff}
.lbl.axis{font-family:var(--f-mono);font-style:italic;font-weight:700;font-size:18px;text-shadow:0 0 4px #fff,0 0 4px #fff}
.views{position:absolute;right:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stage-note{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--panel) 75%,transparent);padding:2px 8px;border-radius:6px}
.note{position:relative;height:min(380px,55vh);flex:none;border:1.5px solid #D9DFE3;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background-color:#FBFAF6;
  background-image:linear-gradient(#E3E8EC 1px,transparent 1px),linear-gradient(90deg,#E3E8EC 1px,transparent 1px);background-size:24px 24px}
.note-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:rgba(251,250,246,.94);border-bottom:1px solid #D9DFE3}
.note-bar .ttl{font-family:var(--f-display);font-size:16px;color:#13222C;margin-right:6px}
.tb{border:1.5px solid #C6D0D7;background:#fff;color:#13222C;border-radius:8px;padding:5px 10px;font-size:13px;font-family:var(--f-body);display:inline-flex;align-items:center;gap:6px}
.tb[aria-pressed="true"]{border-color:#13222C;box-shadow:inset 0 0 0 1px #13222C;background:#EEF2F4}
.tb .sw{width:14px;height:14px;border-radius:50%;display:inline-block}
.tb.close{margin-left:auto;background:#13222C;color:#fff;border-color:#13222C}
#noteCv{flex:1;min-height:0;width:100%;touch-action:none;cursor:crosshair;display:block}
#noteCv.erasing{cursor:cell}
.qrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.notebtn{flex:none}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--f-display);font-size:22px;padding:6px 18px;border-radius:999px;background:var(--ok);color:var(--panel);white-space:nowrap}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}

.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.mtag{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:600}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.story{margin:0}
.eq{font-family:var(--f-mono);font-size:clamp(16px,1.6vw,19px);font-weight:600;line-height:1.8;background:var(--soft);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;white-space:normal;text-align:center;color:var(--ink)}
.eq .t{white-space:nowrap}
.pts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pts li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:var(--soft)}
.pts .k{font-family:var(--f-mono);font-weight:600;width:26px;height:26px;border-radius:6px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font-size:13px}
.pts .nm{font-size:14px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts code{font-family:var(--f-mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.q{margin:0;font-weight:700}
form{display:flex;flex-wrap:wrap;gap:8px}
.fld{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);flex:1 1 70px;min-width:0}
.fld:focus-within{border-color:var(--accent)}
.fld input{border:0;background:transparent;width:100%;min-width:0;padding:10px 8px;font-family:var(--f-mono);font-size:18px;font-weight:600;outline:none}
.fld.wide{flex:1 1 100%}
.fld>label{font-family:var(--f-mono);font-weight:600;color:var(--muted);padding-left:12px;font-size:15px;min-width:2.2em}
.fld em{font-style:normal;color:var(--muted);font-size:14px;padding:0 4px}
.fld.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.kb{flex:none;margin:4px;border:1.5px solid var(--line);background:var(--soft);border-radius:8px;padding:4px 9px;font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--ink)}
.kb[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.pad{flex:1 1 100%;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);padding:10px;display:flex;flex-direction:column;gap:8px}
.pad-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.pad-prev{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pad-prev.bad{color:var(--bad)}
.pad-keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pk{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 0;font-family:var(--f-mono);font-size:17px;font-weight:600;color:var(--ink);touch-action:manipulation}
.pk:active{transform:translateY(1px)}
.pk.op{color:var(--accent)}
.pk.fn{background:color-mix(in srgb,var(--ink) 7%,var(--panel))}
.pk.nav{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.pk.wide2{grid-column:span 2;font-family:var(--f-body);font-size:14px}
.pk.ok{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.go{flex:1 1 100%;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:20px;padding:10px;letter-spacing:.04em}
.go:disabled{opacity:.45;cursor:default}
.fb{border-radius:10px;padding:10px 12px;font-size:14px}
.fb.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.helps{display:flex;gap:8px;flex-wrap:wrap}
.helps:empty,#boxes:empty,#nextWrap:empty{display:none}
.box{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.box+.box{margin-top:8px}
.box b{display:block;font-size:12px;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.box .m{font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}
.next{width:100%;border:0;border-radius:10px;background:var(--ink);color:var(--panel);font-weight:700;padding:11px;font-size:15px}
.legend{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}

.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center;padding:16px;z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
.card h3{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;line-height:1.2}
.card p{margin:0;color:var(--muted);font-size:14px}
.big{font-family:var(--f-display);font-size:56px;line-height:1;color:var(--accent)}
.big small{font-size:22px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.rows li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;border-bottom:1px solid var(--line)}
.rows li span:last-child{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card .row>*{flex:1 1 140px}
.lf{display:grid;gap:4px}
.lf span{font-size:13px;font-weight:700;color:var(--muted)}
.lf input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:20px;font-weight:600;background:var(--soft);width:100%}
.lf input:focus{border-color:var(--accent);outline:none}
.lf input#sid{font-family:var(--f-mono);letter-spacing:.15em}
.recinfo{background:var(--soft);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:13px!important;color:var(--ink)!important}
.err{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:14px}
#report{position:fixed;left:-12000px;top:0;pointer-events:none}
.cert{width:1123px;height:794px;box-sizing:border-box;position:relative;background:#FBF7EC;color:#1E2B33;font-family:"Gowun Batang","Gowun Dodum",serif;padding:30px;overflow:hidden}
.cert .frame{position:absolute;inset:22px;border:3px solid #1F3A5A;border-radius:6px}
.cert .frame2{position:absolute;inset:30px;border:1px solid #B08A3E;border-radius:3px}
.cert .bgaxes{position:absolute;right:40px;bottom:40px;width:330px;opacity:.13}
.cert .in{position:relative;height:100%;padding:26px 46px 22px;display:flex;flex-direction:column;gap:14px}
.cert .top{display:flex;align-items:center;gap:18px;border-bottom:1.5px solid #1F3A5A;padding-bottom:12px}
.cert .top img{width:74px;height:74px}
.cert .top .tt{flex:1}
.cert .top .en{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.32em;color:#8A6A2C}
.cert .top h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:44px;letter-spacing:.32em;margin:2px 0 0;line-height:1.1;color:#1F3A5A}
.cert .top .no{text-align:right;font-size:12px;color:#55636c}
.cert .top .no b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;color:#1E2B33;letter-spacing:.04em}
.cert .mid{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}
.cert table{border-collapse:collapse;width:100%;font-size:15px}
.cert th,.cert td{border-bottom:1px solid #D9CFB8;padding:6px 6px;text-align:left}
.cert th{width:96px;color:#6A5A3A;font-weight:400;font-size:13px;letter-spacing:.05em}
.cert td{font-weight:700}
.cert td.mono{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14px}
.cert .cap{font-size:12px;letter-spacing:.2em;color:#8A6A2C;margin-bottom:4px}
.cert .grade{font-family:"Jua",sans-serif;font-weight:400;font-size:21px;color:#B23A1A}
.cert .ms{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cert .m{border:1px solid #CDBF9F;border-radius:6px;padding:6px 6px 5px;text-align:center;background:#FFFDF6}
.cert .m b{display:block;font-size:11px;font-weight:400;color:#6A5A3A;white-space:nowrap}
.cert .m span{font-family:"Jua",sans-serif;font-size:20px;color:#1F3A5A}
.cert .m small{display:block;font-size:10px;color:#8b7d62}
.cert .stmt{flex:1;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1.8;text-align:center;margin:0}
.cert .bot{display:flex;align-items:flex-end;justify-content:space-between}
.cert .date{font-size:16px;letter-spacing:.1em}
.cert .issuer{position:relative;font-size:21px;font-weight:700;letter-spacing:.12em;padding-right:58px;margin-right:30px}
.cert .issuer small{display:block;font-size:13px;font-weight:400;letter-spacing:.08em;color:#55636c;margin-bottom:2px}
.cert .issuer .in2{font-weight:400;color:#55636c}
.cert .issuer img{position:absolute;right:-44px;top:-46px;width:118px;height:118px;transform:rotate(-8deg);opacity:.92}
.rp{width:794px;height:1123px;box-sizing:border-box;padding:46px 52px 40px;background:#fff;color:#16232c;font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13px;line-height:1.55;display:flex;flex-direction:column}
.rp-body{flex:1;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.rp-foot{display:flex;justify-content:space-between;font-size:11px;color:#6b7a84;border-top:1px solid #d5dde2;padding-top:8px}
.rp h1{font-family:"Jua",sans-serif;font-weight:400;font-size:30px;margin:0;line-height:1.15}
.rp .sub{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;color:#c24a08}
.rp table{border-collapse:collapse;width:100%}
.rp th,.rp td{border:1px solid #d5dde2;padding:6px 8px;text-align:left;vertical-align:top}
.rp th{background:#f1f4f6;font-weight:700;font-size:12px;color:#44535d}
.rp td.n{font-family:"IBM Plex Mono",monospace;text-align:right}
.rp .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rp .kpi{border:1px solid #d5dde2;border-radius:8px;padding:8px 10px}
.rp .kpi b{display:block;font-size:11px;color:#6b7a84;font-weight:500}
.rp .kpi span{font-family:"Jua",sans-serif;font-size:24px;color:#16232c}
.rp .mb{border:1px solid #d5dde2;border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rp .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rp .mh strong{font-size:15px}
.rp .mh em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#c24a08}
.rp .sc{font-family:"Jua",sans-serif;font-size:20px}
.rp .mono{font-family:"IBM Plex Mono",monospace;overflow-wrap:anywhere}
.rp .tries{display:flex;flex-wrap:wrap;gap:6px}
.rp .tr{border-radius:6px;padding:1px 8px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.rp .tr.o{background:#e1f2e7;color:#14683a}.rp .tr.x{background:#f8e3e1;color:#b9322a}
.rp .lbl2{font-size:11px;font-weight:700;color:#6b7a84;margin-right:6px}
.codein{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:.2em;background:var(--soft);width:100%;text-align:center}

@media (min-width:641px){
  html,body{height:100%;overflow:hidden}
  .stage{height:100%}
  .panel{height:100%}
}
@media (max-width:640px){
  body{display:block;height:auto}
  main{grid-template-columns:1fr}
  .stage{height:58vh;min-height:320px}
  .meta{margin-left:0}
  .panel h2{font-size:26px}
}

/* ===== 난수 · 유틸 ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ro=n=>n===3?'으로':'로';
const fmt=n=>(Math.round(n*1000)/1000).toString().replace('-','−');
const C=p=>`(${p.map(fmt).join(', ')})`;
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
const sq=p=>p[0]*p[0]+p[1]*p[1]+p[2]*p[2];
/* 난이도 맞추기: 모든 반이 '계산은 해야 하지만 어렵지 않은' 수준이 되도록 */
let LOOSE=0;
const allDiff=(A,B)=>A.every((v,i)=>v!==B[i]);
const gap=(A,B,kxy,kz)=>Math.abs(A[0]-B[0])>=kxy&&Math.abs(A[1]-B[1])>=kxy&&Math.abs(A[2]-B[2])>=kz;
const isO=p=>p[0]===0&&p[1]===0&&p[2]===0;   /* 정문(원점)은 계산이 너무 쉬워져서 주어진 점에서 뺌 */
const notLM=p=>!LM.some(l=>same(l[1],p));
const same=(a,b)=>a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];
const add=(a,b,k=1)=>a.map((v,i)=>v+k*b[i]);
function pairs(){const P=[];for(let i=0;i<LM.length;i++)for(let j=0;j<LM.length;j++)if(i!==j)P.push([LM[i],LM[j]]);return shuffle(P)}
function areaName(q){
  const [x,y,z]=toOld(q);const up=z>0?' 상공':'';
  if(x>=24.5&&x<=37.2&&y>=5.1&&y<=27.4)return '운동장'+up;
  if(x>=24.5&&x<=37.2&&y>=28.4&&y<=33.1)return '주차장'+up;
  if(y>34.5)return '학교 앞 도로'+up;
  for(const S of SOLIDS){const f=S.hall?inHall(x,y):inPoly(x,y,S.poly);if(f&&z>=S.h)return z===S.h?'건물 옥상':'건물 위 상공'}
  return '학교 마당'+up;
}

function gDist(){
  const tops=shuffle(LM.filter(l=>l[1][2]>0));
  for(const [an,A] of tops){
    const c=[];const dz=A[2];
    for(let dx=-24;dx<=24;dx++)for(let dy=-24;dy<=24;dy++){const s=dx*dx+dy*dy+dz*dz,d=Math.round(Math.sqrt(s));if(d*d===s&&d>=9&&d<=21&&Math.abs(dx)>=2&&Math.abs(dy)>=2&&Math.abs(dx)!==Math.abs(dy)){const B=[A[0]+dx,A[1]+dy,0];if(okPt(B))c.push([B,d])}}
    if(c.length){const[B,D]=pick(c);
      return{tag:'두 점 사이의 거리',title:'배터리 충전',
        story:`A(${an})에서 출발해 ${areaName(B)}에 있는 배송 지점 B까지 직선으로 날아가요. 드론은 거리 1칸을 날 때마다 배터리 1칸을 써요.`,
        pts:[['A',an,A],['B',areaName(B)+' 배송 지점',B]],segs:[['A','B']],
        q:'배터리를 정확히 몇 칸 충전해야 B에 딱 맞게 도착할까요?',ask:'num',unit:'칸',ans:D,start:A,target:B,tk:'B',
        hint:'두 점 사이의 거리 = √((x₂−x₁)² + (y₂−y₁)² + (z₂−z₁)²)',
        sol:`AB = √((${B[0]}−${A[0]})² + (${B[1]}−${A[1]})² + (${B[2]}−${A[2]})²) = √${D*D} = ${D}`};}
  }
}
function gMid(){
  for(const strict of[true,false])for(const[[an,A],[bn,B]]of pairs()){
    if(A.some((v,i)=>(v+B[i])%2))continue;const M=A.map((v,i)=>(v+B[i])/2);
    if(!okPt(M)||dist(A,B)<7)continue;
    if(strict&&!(gap(A,B,3,2)&&M[2]>0&&notLM(M)&&!isO(A)&&!isO(B)))continue;if(!strict)LOOSE++;
    return{tag:'선분의 중점',title:'와이파이 중계기',
      story:`A(${an})와 B(${bn}) 사이 신호가 약해요. 선분 AB의 정중앙에 드론으로 와이파이 중계기를 달아야 해요.`,
      pts:[['A',an,A],['B',bn,B]],segs:[['A','B']],
      q:'중계기를 달 점 M의 좌표는?',ask:'xyz',ans:M,start:A,target:M,tk:'M',
      hint:'선분 AB의 중점 = ((x₁+x₂)/2, (y₁+y₂)/2, (z₁+z₂)/2)',
      sol:`M = ((${A[0]}+${B[0]})/2, (${A[1]}+${B[1]})/2, (${A[2]}+${B[2]})/2) = ${C(M)}`};
  }
}
function gRev(){
  for(const strict of[true,false])for(const[[an,A],[mn,M]]of pairs()){
    const B=M.map((v,i)=>2*v-A[i]);
    if(!okPt(B)||dist(A,M)<5)continue;
    if(strict&&!(gap(A,M,2,1)&&notLM(B)&&dist(A,M)<=16&&!isO(A)&&!isO(M)))continue;if(!strict)LOOSE++;
    return{tag:'중점의 활용',title:'수학 선생님의 메모',
      story:`수학 선생님 메모: “A(${an})와 내가 교구를 받을 곳 B의 딱 중간이 M(${mn})이야.” 메모만 보고 B로 수학 교구를 배달하세요.`,
      pts:[['A',an,A],['M',mn,M]],segs:[['A','M']],
      q:'교구를 받을 곳 B의 좌표는?',ask:'xyz',ans:B,start:A,target:B,tk:'B',
      hint:'M이 선분 AB의 중점이면 A + B = 2M, 즉 B = 2M − A',
      sol:`B = 2M − A = (2·${M[0]}−${A[0]}, 2·${M[1]}−${A[1]}, 2·${M[2]}−${A[2]}) = ${C(B)}`,after:[['M','B']]};
  }
}
function gIn(){
  const RT=[[1,2],[2,1],[1,3],[3,1],[2,3],[3,2]];
  for(const strict of[true,false])for(const[[an,A],[bn,B]]of pairs())for(const[m,n]of shuffle(RT.slice())){
    const k=m+n,d=B.map((v,i)=>v-A[i]);if(d.some(v=>v%k))continue;
    const P=A.map((v,i)=>v+m*d[i]/k);
    if(!okPt(P)||dist(A,B)<7)continue;
    if(strict&&!(d.every(v=>v!==0)&&notLM(P)&&!isO(A)&&!isO(B)))continue;if(!strict)LOOSE++;
    return{tag:'선분의 내분점',title:`${m} : ${n} 우유 상자 투하`,
      story:`급식 우유를 싣고 A(${an})에서 B(${bn})로 곧게 날아가는 중이에요. 선분 AB를 ${m} : ${n}${ro(n)} 내분하는 점 P에서 우유 상자를 내려야 해요.`,
      pts:[['A',an,A],['B',bn,B]],segs:[['A','B']],
      q:'점 P의 좌표는?',ask:'xyz',ans:P,start:A,target:P,tk:'P',
      hint:'m : n 내분점의 x좌표 = (m·x₂ + n·x₁)/(m + n). y, z도 같은 방법이에요.',
      sol:`P = ((${m}·${B[0]} + ${n}·${A[0]})/${k}, (${m}·${B[1]} + ${n}·${A[1]})/${k}, (${m}·${B[2]} + ${n}·${A[2]})/${k}) = ${C(P)}`};
  }
}
function gEx(){
  const RT=[[2,1],[3,2],[1,2],[2,3],[4,3],[3,4]];
  for(const strict of[true,false])for(const[[an,A],[bn,B]]of pairs())for(const[m,n]of shuffle(RT.slice())){
    const Q=A.map((v,i)=>(m*B[i]-n*v)/(m-n));
    if(!okPt(Q)||dist(A,B)<4||(strict&&A[2]===B[2]))continue;
    return{tag:'선분의 외분점',title:`${m} : ${n} 축제 조명`,
      story:`학교 축제 준비! A(${an})와 B(${bn})를 잇는 직선의 연장선 위, 선분 AB를 ${m} : ${n}${ro(n)} 외분하는 점 Q에 무대 조명을 달아 주세요.`,
      pts:[['A',an,A],['B',bn,B]],segs:[['A','B']],
      q:'조명을 달 점 Q의 좌표는?',ask:'xyz',ans:Q,start:A,target:Q,tk:'Q',
      hint:'m : n 외분점의 x좌표 = (m·x₂ − n·x₁)/(m − n). m > n이면 B 바깥쪽, m < n이면 A 바깥쪽에 있어요.',
      sol:`Q = ((${m}·${B[0]} − ${n}·${A[0]})/(${m}−${n}), (${m}·${B[1]} − ${n}·${A[1]})/(${m}−${n}), (${m}·${B[2]} − ${n}·${A[2]})/(${m}−${n})) = ${C(Q)}`,
      after:[[m>n?'B':'A','Q']]};
  }
}
function gCen(){
  const idx=shuffle([...LM.keys()]);
  for(const strict of[true,false])for(let a=0;a<idx.length;a++)for(let b=a+1;b<idx.length;b++)for(let c=b+1;c<idx.length;c++){
    const[[an,A],[bn,B],[cn,Cc]]=[LM[idx[a]],LM[idx[b]],LM[idx[c]]];
    const s=A.map((v,i)=>v+B[i]+Cc[i]);if(s.some(v=>v%3))continue;
    const G=s.map(v=>v/3);
    if(!okPt(G)||dist(A,B)<6||dist(B,Cc)<6||dist(A,Cc)<6)continue;
    if(strict){const P3=[A,B,Cc];if(G[2]===0||P3.some(isO)||G.some(v=>v===0)||[0,1,2].some(i=>P3[0][i]===P3[1][i]&&P3[1][i]===P3[2][i])||!notLM(G))continue}else LOOSE++;
    return{tag:'삼각형의 무게중심',title:'응원 드론 집결',
      story:`스포츠문화축제 응원 드론쇼! A(${an}), B(${bn}), C(${cn})에서 출발한 드론들이 삼각형 ABC의 무게중심 G에 모여야 해요.`,
      pts:[['A',an,A],['B',bn,B],['C',cn,Cc]],segs:[['A','B'],['B','C'],['C','A']],

      hint:'무게중심 = ((x₁+x₂+x₃)/3, (y₁+y₂+y₃)/3, (z₁+z₂+z₃)/3)',
      sol:`G = ((${A[0]}+${B[0]}+${Cc[0]})/3, (${A[1]}+${B[1]}+${Cc[1]})/3, (${A[2]}+${B[2]}+${Cc[2]})/3) = ${C(G)}`};
  }
}
function gAxis(){
  for(const strict of[true,false])for(const[[an,A],[bn,B]]of pairs()){
    if(A[1]===B[1])continue;const num=sq(B)-sq(A),den=2*(B[1]-A[1]);
    if(num%den)continue;const t=num/den;

    if(strict&&!(!isO(A)&&!isO(B)&&A[2]!==B[2]&&A[0]!==B[0]&&Math.abs(den)>=4&&t!==0&&2*t!==A[1]+B[1]))continue;if(!strict)LOOSE++;

function gSph(){

  const lin=(v,x)=>v===0?'':(v>0?` − ${2*v}${x}`:` + ${-2*v}${x}`);
  const eq=`x² + y² + z²${lin(c[0],'x')}${lin(c[1],'y')}${lin(c[2],'z')}${k>0?` + ${k}`:k<0?` − ${-k}`:''} = 0`;
  const sq2=(x,v)=>v===0?`${x}²`:v>0?`(${x}−${v})²`:`(${x}+${-v})²`;

    hint:'x, y, z끼리 묶어 완전제곱식으로 바꾸세요. 예: x² − 2ax = (x − a)² − a²',

}

const pad2=n=>String(n).padStart(2,'0');
const fmtDur=ms=>{ms=Math.max(0,ms|0);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}시간 ${pad2(m)}분 ${pad2(x)}초`:`${m}분 ${pad2(x)}초`};
const fmtClock=t=>{const d=new Date(t);return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`};
const fmtDate=t=>{const d=new Date(t);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`};

function awayEnd(){
  if(awayFrom==null)return;const d=Date.now()-awayFrom;awayFrom=null;
  if(!tracking()||d<AWAY_MIN)return;
  game.tk.awayN++;game.tk.awayMs+=d;save();updateTrack();
  report('복귀',`이탈 ${game.tk.awayN}회째 · ${fmtDur(d)}`);
  const tt=$('#toast');tt.textContent=`화면 이탈 ${game.tk.awayN}회째 기록 (${fmtDur(d)})`;tt.style.background='var(--bad)';tt.hidden=false;

}

function updateTrack(){
  const box=$('#track');if(!game||!STU){box.hidden=true;return}
  box.hidden=false;const tk=game.tk,now=Date.now();
  const away=tk.awayMs+(awayFrom!=null&&tracking()?Math.max(0,now-awayFrom):0);
  $('#tStart').textContent=fmtDT(game.start);
  $('#tElapsed').textContent=fmtDur((tk.endAt||now)-game.start);
  $('#tAway').textContent=`${tk.awayN}회 · ${fmtDur(away)}`;
  $('#tAwayWrap').classList.toggle('warn',tk.awayN>0);
  const rc=$('#tRec');rc.textContent=tk.endAt?`✔ 완료 ${fmtClock(tk.endAt)}`:'● 기록 중';rc.classList.toggle('done',!!tk.endAt);
  const rb=$('#resultBtn');rb.disabled=!allDone();rb.title=allDone()?'드론자격증을 발급해요':`${game.ms.length}개 미션을 모두 풀면 발급돼요`;

/* 수식 계산기: + − × ÷ / ^ ² ³ √ π 괄호, 곱셈 기호 생략 가능 */
function evalExpr(src){
  let s=(src||'').replace(/\s/g,'').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3');
  if(!s)return null;
  let i=0;const peek=()=>s[i];
  const num=()=>{const m=s.slice(i).match(/^\d+(\.\d+)?|^\.\d+/);if(!m)return null;i+=m[0].length;return parseFloat(m[0])};
  function primary(){
    const c=peek();
    if(c==='('){i++;const v=expr();if(s[i]!==')')throw 0;i++;return v}
    if(c==='π'){i++;return Math.PI}
    const n=num();if(n==null)throw 0;return n;
  }
  function unary(){
    const c=peek();
    if(c==='-'){i++;return -unary()}
    if(c==='+'){i++;return unary()}
    if(c==='√'){i++;const v=power();if(v<0)throw 0;return Math.sqrt(v)}
    return power();
  }
  function power(){const b=primary();if(peek()==='^'){i++;return Math.pow(b,unary())}return b}
  const startsFactor=c=>c==='('||c==='π'||c==='√'||/[\d.]/.test(c||'');
  function term(){
    let v=unary();
    for(;;){const c=peek();
      if(c==='*'){i++;v*=unary()}
      else if(c==='/'){i++;const d=unary();if(d===0)throw 0;v/=d}
      else if(startsFactor(c))v*=unary();
      else return v}
  }
  function expr(){let v=term();for(;;){const c=peek();if(c==='+'){i++;v+=term()}else if(c==='-'){i++;v-=term()}else return v}}
  try{const v=expr();if(i!==s.length||!Number.isFinite(v))return null;return v}catch(e){return null}
}

function submit(e){

    const tgt=[Math.max(-4,Math.min(38,g[0])),Math.max(-10,Math.min(44,g[1])),Math.max(0,Math.min(14,g[2]))];

function frame(now){
  step(now);
  if(camAnim){const k=Math.min(1,(now-camAnim.s)/(reduce?1:900)),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(camAnim.p0,camAnim.p1,e);controls.target.lerpVectors(camAnim.t0,camAnim.t1,e);if(k>=1)camAnim=null}
  const p=drone.pos,bob=drone.anim||drone.crash?0:Math.sin(now/320)*.06;
  droneObj.position.copy(Tp(p)).add(new THREE.Vector3(0,.62+bob,0));
  droneObj.rotation.z=drone.crash?.5:0;
  droneObj.userData.pkg.visible=droneObj.userData.tape.visible=drone.carry;
  const spin=drone.crash&&!drone.anim?0:now/35;droneObj.userData.blades.forEach((b,j)=>b.rotation.y=spin+j);
  if(follow){const tg=Tp(p);controls.target.lerp(tg,.08)}
  droneLbl.parentNode&&(labels.find(L=>L.kind==='drone').v.copy(droneObj.position));
  const txt=C(p.map(v=>Math.round(v*10)/10));if(txt!==lastLbl){droneLbl.textContent=txt;lastLbl=txt}

}

  s=(s||'').replace(/\D/g,'');

  const grade=+s[0],cls=+s.slice(1,3),num=+s.slice(3,5);
  if(!cls||!num)return null;
  return{id:s,grade,cls,num,seed:+s.slice(0,3)};
}

function makeSeal(){
  if(SEAL)return SEAL;
  const S=360,c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
  const red='#C9252C',cx=S/2,cy=S/2;
  g.strokeStyle=red;g.fillStyle=red;
  g.lineWidth=16;g.beginPath();g.arc(cx,cy,S/2-14,0,Math.PI*2);g.stroke();
  g.lineWidth=5;g.beginPath();g.arc(cx,cy,S/2-62,0,Math.PI*2);g.stroke();
  const ring='우리 학교 ★ 기하 수업 ★ ';const chars=[...ring];
  g.font='700 34px "Gowun Batang","Gowun Dodum",serif';g.textAlign='center';g.textBaseline='middle';
  chars.forEach((ch,i)=>{const a=-Math.PI/2+i*(Math.PI*2/chars.length);
    g.save();g.translate(cx+Math.cos(a)*(S/2-39),cy+Math.sin(a)*(S/2-39));g.rotate(a+Math.PI/2);g.fillText(ch,0,0);g.restore()});
  {let fs=92;do{g.font=`400 ${fs}px "Jua","Gowun Dodum",sans-serif`;fs-=2}while(g.measureText('수학쌤').width>S*0.5&&fs>30);g.fillText('수학쌤',cx,cy+2);}
  g.font='700 28px "Gowun Batang",serif';g.fillText('之 印',cx,cy+64);g.font='700 26px "Gowun Batang",serif';g.fillText('기 하',cx,cy-62);
  /* 도장 질감 */
  g.globalCompositeOperation='destination-out';
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<1400;i++){g.globalAlpha=.25+rnd()*.6;g.beginPath();g.arc(rnd()*S,rnd()*S,rnd()*2.6,0,Math.PI*2);g.fill()}
  for(let i=0;i<5;i++){g.globalAlpha=.18;g.lineWidth=2+rnd()*5;g.beginPath();const y=rnd()*S;g.moveTo(0,y);g.lineTo(S,y+(rnd()-.5)*60);g.stroke()}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  return SEAL=c.toDataURL('image/png');
}

  g.strokeStyle=gold;g.lineWidth=5;g.beginPath();g.arc(S/2,S/2,S/2-14,0,Math.PI*2);g.stroke();
  g.strokeStyle='#F3E7C9';g.fillStyle='#F3E7C9';g.lineCap='round';
  const cx=S/2,cy=S/2-6;

    place(`<div class="mb"><div class="mh"><div><em>MISSION ${String(i+1).padStart(2,'0')} · ${m.tag}</em><br><strong>${esc(m.title)}</strong></div><span class="sc">${r.done?r.pts+'점':'미완료'}</span></div>
      <div>${esc(m.story)}</div>${m.eq?`<div class="mono" style="font-size:15px;font-weight:600">${m.eq}</div>`:''}
      <div><span class="lbl2">주어진 점</span><span class="mono">${m.pts.map(([k,nm,p])=>`${k}${C(p)} ${esc(nm)}`).join(' · ')}</span></div>
      <div><span class="lbl2">문제</span>${esc(m.q)}</div>
      <div class="tries"><span class="lbl2">내 답</span>${tries}</div>
      <div><span class="lbl2">정답</span><span class="mono">${ans}</span>${r.hint?' <span class="lbl2" style="margin-left:10px">힌트 사용</span>':''}${r.peek?' <span class="lbl2">풀이 봄</span>':''}</div>
      <div><span class="lbl2">풀이</span><span class="mono">${m.sol}</span></div></div>`);
  });
  pages.forEach((p,i)=>{const f=p.querySelectorAll('.rp-foot span');f[0].textContent=`${STU.id} ${STU.name} · 드론 조종 자격증 부록`;f[1].textContent=`비행 일지 ${i+1} / ${pages.length}`});
  return pages;
}
$('#pdfBtn').onclick=async()=>{
  const btn=$('#pdfBtn'),msg=$('#pdfMsg');
  const show=t=>{msg.textContent=t;msg.hidden=false};
  const downloads=await getDl();
  if(!allDone()){show('모든 미션을 풀어야 발급돼요.');return}
  if(!window.jspdf||!window.html2canvas){show('PDF 도구를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.');return}
  btn.disabled=true;btn.textContent='자격증 만드는 중…';msg.hidden=true;
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const rb=$('#report');
    const pages=buildReport();
    const cert=buildCert();rb.insertBefore(cert,rb.firstChild);
    rb.style.left='0';rb.style.zIndex='-1';
    const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'landscape'});
    const cc=await window.html2canvas(cert,{scale:2,backgroundColor:'#FBF7EC',logging:false,useCORS:true});
    pdf.addImage(cc.toDataURL('image/jpeg',0.93),'JPEG',0,0,297,210);
    for(let i=0;i<pages.length;i++){
      const c=await window.html2canvas(pages[i],{scale:2,backgroundColor:'#ffffff',logging:false,useCORS:true});
      pdf.addPage('a4','portrait');
      pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,297);
    }
    const blob=pdf.output('blob');
    const fname=`드론자격증_${STU.id}_${STU.name}.pdf`;
    if(downloads)await downloads.save({filename:fname,data:blob});
    else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
    show('드론 자격증을 저장했어요. 1쪽은 자격증, 다음 쪽부터는 미션별 풀이 기록(비행 일지)이에요.');
  }catch(err){
    const c=err&&err.code;
    show(c==='declined'?'저장을 취소했어요. 다시 누르면 받을 수 있어요.':c==='rate_limited'?'저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요.':'자격증을 만들지 못했어요. 다시 눌러 주세요.');
  }finally{btn.disabled=false;btn.textContent='드론 자격증 PDF 받기';const rb=$('#report');rb.innerHTML='';rb.style.left='';rb.style.zIndex=''}
};

requestAnimationFrame(frame);
setTimeout(()=>$("#sid").focus(),300);
})();
</script>
